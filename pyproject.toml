[project]
name = "ups-label-cropper"
version = "1.3.0"
description = "UPS Label Cropper - Auto-rotates and scales UPS labels for thermal printer printing"
requires-python = ">=3.10"
dependencies = [
    "PyMuPDF>=1.23.0",
    "watchdog>=3.0.0",
    "Pillow>=10.0.0",
    "pywin32; platform_system == 'Windows'",
    "platformdirs>=4.0.0",
    # System tray icon (Windows only)
    "infi-systray>=0.1.12.1; platform_system == 'Windows'",
]

[project.scripts]
ups-label-cropper = "ups_label_cropper.crop:main"
ups-label-cropper-watch = "ups_label_cropper.__main__:run_watch_mode"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ups_label_cropper"]

[tool.hatch.build.targets.wheel.force-include]
"src/ups_label_cropper/bin" = "ups_label_cropper/bin"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
