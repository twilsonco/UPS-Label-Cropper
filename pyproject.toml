[project]
name = "ups-label-cropper"
version = "0.1.0"
description = "UPS Label Cropper - Auto-rotates and scales UPS labels for thermal printer printing"
requires-python = ">=3.10"
dependencies = [
    "PyMuPDF>=1.23.0",
]

[project.scripts]
ups-label-cropper = "ups_label_cropper.crop:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ups_label_cropper"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
