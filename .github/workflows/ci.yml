name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  pre_job:
    name: Path filter check
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
      paths_result: ${{ steps.skip_check.outputs.paths_result }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          concurrent_skipping: 'same_content_newer'
          skip_after_successful_duplicate: true
          do_not_skip: '["workflow_dispatch"]'
          paths_filter: |
            tests:
              paths:
                - 'src/**'
                - 'tests/**'

  test:
    needs: [pre_job]
    if: github.event_name == 'workflow_dispatch' || (needs.pre_job.outputs.should_skip == 'false' && !fromJSON(needs.pre_job.outputs.paths_result).tests.should_skip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: uv run pytest

  release-please:
    needs: [pre_job]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GH_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

  build-windows-exe:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - name: Build EXE
        shell: powershell
        run: |
          uv pip install pyinstaller
          uv run pyinstaller --onefile --noconsole `
            --name "UPS-Label-Cropper" `
            --add-data "assets;assets" `
            --add-data "src/ups_label_cropper/bin:ups_label_cropper/bin" `
            --icon "assets/icon.ico" `
            src/ups_label_cropper/__main__.py
      - name: Upload Release Artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ needs.release-please.outputs.tag_name }} dist/UPS-Label-Cropper.exe