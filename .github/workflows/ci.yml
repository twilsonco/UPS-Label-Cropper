name: CI
on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: uv run pytest

  build-windows-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - name: Build EXE
        shell: powershell
        run: |
          uv pip install pyinstaller
          uv run pyinstaller --onefile --noconsole `
            --name "UPS-Label-Cropper" `
            --add-data "assets;assets" `
            --add-data "src/ups_label_cropper/bin:src/ups_label_cropper/bin" `
            --icon "assets/icon.ico" `
            src/ups_label_cropper/__main__.py
      - uses: actions/upload-artifact@v4
        with:
          name: ups-label-cropper-exe
          path: dist/UPS-Label-Cropper.exe