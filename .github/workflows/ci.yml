name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  pre_job:
    name: Path filter check
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
      paths_result: ${{ steps.skip_check.outputs.paths_result }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          concurrent_skipping: 'same_content_newer'
          skip_after_successful_duplicate: true
          do_not_skip: '["workflow_dispatch"]'
          paths_filter: |
            tests:
              paths:
                - 'src/**'
                - 'tests/**'

  test:
    needs: [pre_job]
    if: github.event_name == 'workflow_dispatch' || (needs.pre_job.outputs.should_skip == 'false' && !fromJSON(needs.pre_job.outputs.paths_result).tests.should_skip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: uv run pytest

  release-please:
    needs: [pre_job]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GH_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

  build-windows-exe:
    needs: [test, release-please]
    # Build whenever tests pass (PRs, pushes, manual runs) OR a release was
    # created. Release commits usually touch only version files, which the
    # path filter skips `test` for -- !cancelled() keeps this job alive when
    # a needed job is skipped, and !failure() still blocks on real failures.
    # Docs-only PRs (test skipped, no release) correctly build nothing.
    if: ${{ !cancelled() && !failure() && (needs.test.result == 'success' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: windows-latest
    permissions:
      contents: write
      # Not implied by contents:write -- once a workflow declares a top-level
      # `permissions` map, every scope it omits becomes `none`. upload-artifact
      # authenticates via the runner's runtime token (so uploads work without
      # this), but actions:write is required for artifact REST/download API
      # access, so declaring it keeps things explicit.
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --group build
      - name: Build EXE (one-dir, versioned metadata)
        shell: powershell
        env:
          UPS_LABEL_CROPPER_VERSION: ${{ needs.release-please.outputs.tag_name }}
        run: |
          uv run pyinstaller --clean --noconfirm UPS-Label-Cropper.spec
      - name: Log build provenance
        shell: powershell
        run: |
          $exe = "dist\UPS-Label-Cropper\UPS-Label-Cropper.exe"
          Write-Host "== EXE version metadata =="
          Get-Item $exe | Select-Object -ExpandProperty VersionInfo | Format-List ProductName, CompanyName, FileVersion, FileDescription
          Write-Host "== Authenticode signatures =="
          Get-AuthenticodeSignature $exe | Format-List Status, StatusMessage, SignerCertificate
      - name: Zip release artifact
        shell: powershell
        run: |
          Compress-Archive -Path "dist\UPS-Label-Cropper" -DestinationPath "UPS-Label-Cropper-windows-x64.zip"
          Get-FileHash -Algorithm SHA256 "UPS-Label-Cropper-windows-x64.zip"
      # Release builds attach the ZIP to the GitHub release...
      - name: Upload Release Artifact
        if: ${{ needs.release-please.outputs.release_created == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: UPS-Label-Cropper-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      # ...everything else (PRs, manual runs) publishes it as a workflow
      # artifact so the EXE can be tested without cutting a release. Artifacts
      # appear in the "Artifacts" box on the run *summary* page (left column,
      # below the job list) and require being signed in to GitHub to download.
      # The run number is in the name so consecutive test builds are
      # distinguishable in that list.
      - name: Upload Build Artifact
        if: ${{ needs.release-please.outputs.release_created != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: UPS-Label-Cropper-windows-x64-build${{ github.run_number }}
          path: UPS-Label-Cropper-windows-x64.zip
          if-no-files-found: error
          retention-days: 14