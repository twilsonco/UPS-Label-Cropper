name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  pre_job:
    name: Path filter check
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
      paths_result: ${{ steps.skip_check.outputs.paths_result }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          concurrent_skipping: 'same_content_newer'
          skip_after_successful_duplicate: true
          do_not_skip: '["workflow_dispatch"]'
          paths_filter: |
            tests:
              paths:
                - 'src/**'
                - 'tests/**'

  test:
    needs: [pre_job]
    if: github.event_name == 'workflow_dispatch' || (needs.pre_job.outputs.should_skip == 'false' && !fromJSON(needs.pre_job.outputs.paths_result).tests.should_skip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: uv run pytest

  release-please:
    needs: [pre_job]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GH_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

  build-windows-exe:
    needs: [test, release-please]
    # Build whenever tests pass (PRs, pushes, manual runs) OR a release was
    # created. Release commits usually touch only version files, which the
    # path filter skips `test` for -- !cancelled() keeps this job alive when
    # a needed job is skipped, and !failure() still blocks on real failures.
    # Docs-only PRs (test skipped, no release) correctly build nothing.
    if: ${{ !cancelled() && !failure() && (needs.test.result == 'success' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: windows-latest
    permissions:
      contents: write
      # Not implied by contents:write -- once a workflow declares a top-level
      # `permissions` map, every scope it omits becomes `none`. upload-artifact
      # authenticates via the runner's runtime token (so uploads work without
      # this), but actions:write is required for artifact REST/download API
      # access, so declaring it keeps things explicit.
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Resolve build version
        # Single source of truth for the EXE VERSIONINFO *and* the installer:
        # release tag when release-please cut one, else the pyproject.toml
        # version. Written to $GITHUB_ENV so every later step (PyInstaller,
        # ISCC, artifact names) sees the same value. Mirrors the "strip
        # leading v" behaviour of build/version_info.py.
        shell: powershell
        env:
          UPS_LABEL_CROPPER_VERSION: ${{ needs.release-please.outputs.tag_name }}
        run: |
          $v = $env:UPS_LABEL_CROPPER_VERSION
          if ([string]::IsNullOrWhiteSpace($v)) {
            $m = Select-String -Path pyproject.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1
            $v = if ($m) { $m.Matches[0].Groups[1].Value } else { "0.0.0" }
          }
          $v = $v.TrimStart('v')
          # -Encoding ascii on purpose: Windows PowerShell 5.1's "utf8" writes
          # a BOM that corrupts the first GITHUB_ENV key. Values are ASCII.
          "UPS_LABEL_CROPPER_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append
          "INSTALLER_NAME=UPS-Label-Cropper-Setup-$v-windows-x64.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append
          Write-Host "Build version: $v"
      - run: uv sync --group build
      - name: Build EXE (one-dir, versioned metadata)
        shell: powershell
        run: |
          uv run pyinstaller --clean --noconfirm UPS-Label-Cropper.spec
      - name: Install Inno Setup (pinned, hash-verified)
        # Inno Setup is NOT preinstalled on windows-latest anymore: it was
        # dropped from the windows-2025 image and GitHub declined to add it
        # back (actions/runner-images#12464). Pin the exact version and
        # verify its SHA-256 against jrsoftware's signed .issig file-hash
        # (https://github.com/jrsoftware/issrc/releases/tag/is-6_7_3) so a
        # compromised download can never end up compiling a release.
        # Upgrade deliberately: new version -> new hash -> review.
        shell: powershell
        run: |
          $innoVersion = "6.7.3"
          $expected = "9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732"
          $exe = "innosetup-$innoVersion.exe"
          $tag = "is-" + ($innoVersion -replace '\.', '_')
          $url = "https://github.com/jrsoftware/issrc/releases/download/$tag/$exe"
          Invoke-WebRequest -Uri $url -OutFile $exe
          $actual = (Get-FileHash -Algorithm SHA256 $exe).Hash
          # -ne is case-insensitive; Get-FileHash returns uppercase hex.
          if ($actual -ne $expected) {
            Write-Error "Inno Setup SHA-256 mismatch! expected=$expected actual=$actual Refusing to build a release with an unverified compiler."
            exit 1
          }
          Start-Process -FilePath ".\$exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait
          Remove-Item $exe
      - name: Build installer (Inno Setup)
        shell: powershell
        run: |
          # Resolve ISCC defensively: 6.x installs to "Inno Setup 6" under
          # Program Files (x86), but older/local installs vary. Fail loudly
          # rather than silently skipping the installer build.
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup\ISCC.exe",
            "${env:LOCALAPPDATA}\Programs\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            Write-Error "ISCC.exe not found in any known Inno Setup location."
            exit 1
          }
          Write-Host "Using ISCC: $iscc"
          & $iscc "installer\ups-label-cropper.iss"
          if ($LASTEXITCODE -ne 0) { Write-Error "ISCC failed with exit code $LASTEXITCODE"; exit $LASTEXITCODE }
          Get-Item "dist\$env:INSTALLER_NAME" | Select-Object Name, Length
          Get-FileHash -Algorithm SHA256 "dist\$env:INSTALLER_NAME"
      - name: Log build provenance
        shell: powershell
        run: |
          $exe = "dist\UPS-Label-Cropper\UPS-Label-Cropper.exe"
          Write-Host "== EXE version metadata =="
          Get-Item $exe | Select-Object -ExpandProperty VersionInfo | Format-List ProductName, CompanyName, FileVersion, FileDescription
          Write-Host "== Installer version metadata =="
          Get-Item "dist\$env:INSTALLER_NAME" | Select-Object -ExpandProperty VersionInfo | Format-List ProductName, CompanyName, FileVersion, FileDescription
          Write-Host "== Authenticode signatures =="
          Get-AuthenticodeSignature $exe | Format-List Status, StatusMessage, SignerCertificate
      # The single-file installer is the ONLY published file, for both GitHub
      # releases and PR/manual workflow runs: it ships the same one-dir tree
      # the old portable ZIP contained, and publishing one file removes the
      # "which of the two do I run?" confusion.
      - name: Upload Release Artifact
        if: ${{ needs.release-please.outputs.release_created == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: dist/${{ env.INSTALLER_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      # ...everything else (PRs, manual runs) publishes the installer as a
      # workflow artifact so it can be tested without cutting a release.
      # Artifacts appear in the "Artifacts" box on the run *summary* page
      # (left column, below the job list) and require being signed in to
      # GitHub to download. The run number is in the name so consecutive test
      # builds are distinguishable in that list.
      - name: Upload Build Artifact
        if: ${{ needs.release-please.outputs.release_created != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: UPS-Label-Cropper-installer-windows-x64-build${{ github.run_number }}
          path: dist/${{ env.INSTALLER_NAME }}
          if-no-files-found: error
          retention-days: 14